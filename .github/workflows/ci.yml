name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fmt / clippy / test / build
    # Linux while this repo is private: private-repo minutes bill macOS at 10x,
    # and the sibling CLIs only get away with `macos-latest` because they are
    # public (where runners are free). The tests are pure logic and never touch
    # the keychain, so the only thing Linux costs us is compiling `keyring`
    # against its libsecret backend instead of the apple-native one — which the
    # libdbus install below covers. Restore the macOS runner when this repo goes
    # public, since macOS is the platform the tool actually targets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install keyring build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release

  security:
    name: audit / deny / secrets
    runs-on: ubuntu-latest
    # gitleaks-action calls the PR API to enumerate the commits to scan, and
    # cargo-audit posts advisory annotations. Without these the job dies with
    # "Resource not accessible by integration" — but only on pull_request
    # events, since a push carries its commits in the payload. Every run so far
    # has been a push, which is why this hasn't bitten yet; rpm-fl-cli's first
    # PR failed exactly this way.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
