<!-- scrubbed synthetic capture: the statement-history table when the
     association DOES publish statements. The test account's associations
     publish none (see notes in AGENTS.md), so this row shape is reconstructed
     from the portal's own `DownloadStatement(fileName, fileAlias)` handler in
     Properties/StatementHistory.cshtml — that call is what `wabhoa statements
     download` uses.

     Structure preserved:
       - table.divTable > tbody.divTableBody > tr.divTableRow, with
         td.divTableCell for date, description-with-link, and amount cells
       - the link's onclick shape:
         DownloadStatement('<fileName>','<fileAlias>');
         where fileName is the opaque server key and fileAlias is the label
       - one row with an HTML-escaped apostrophe (`&#39;`) in the alias, to
         make sure the parser handles the portal's own escaping
       - one row without a link, to prove the parser tolerates it
       - one linked row whose alias contains parentheses — a scan for the
         call's closing `)` that isn't quote-aware truncates the alias there,
         which silently corrupts both the description and the saved filename
-->
