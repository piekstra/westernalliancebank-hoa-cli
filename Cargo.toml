[package]
name = "westernalliancebank-hoa-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Western Alliance Bank HOA assessment payment portal from the command line — Keychain-secured, agent-friendly. Read-only. Unofficial."
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/westernalliancebank-hoa-cli"
homepage = "https://github.com/piekstra/westernalliancebank-hoa-cli"
readme = "README.md"
keywords = ["hoa", "community-association", "payments", "portal", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "wabhoa"
path = "src/lib.rs"

[[bin]]
name = "wabhoa"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps DTO fields and table columns in the order the code
# builds them, rather than alphabetized by serde_json's default BTreeMap.
serde_json = { version = "1", features = ["preserve_order"] }
# Pinned to a commit rather than a tag while cli-common#5 (pk-cli-scrape,
# reauth, ASP.NET dates, the output helpers) is in review. Move these back to
# `tag = "vX.Y.Z"` once it merges and a release is cut — the family convention
# is tag-pinned deps, and a rev pin is a temporary state, not a new habit.
pk-cli-core = { git = "https://github.com/piekstra/cli-common", rev = "3356738e2696bd9487d2ce39cae00bf01055d07e", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", rev = "3356738e2696bd9487d2ce39cae00bf01055d07e" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", rev = "3356738e2696bd9487d2ce39cae00bf01055d07e" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", rev = "3356738e2696bd9487d2ce39cae00bf01055d07e" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", rev = "3356738e2696bd9487d2ce39cae00bf01055d07e" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", rev = "3356738e2696bd9487d2ce39cae00bf01055d07e" }
pk-cli-scrape = { git = "https://github.com/piekstra/cli-common", rev = "3356738e2696bd9487d2ce39cae00bf01055d07e" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
